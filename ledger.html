<!doctype html>

<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳">
<meta name="theme-color" content="#1C2038">
<title>記帳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F4F5F8;color:#1C2038;font:16px/1.45 -apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #E8344E;outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:#F4F5F8;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.num,.big,#amount{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums}

/* hero */
.hero{background:#1C2038;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 26px;border-radius:0 0 30px 30px}
.heroTop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.04em}
.sub{font-size:14px;color:rgba(255,255,255,.72);text-align:right}
#banner{margin:12px 16px 0;background:#FFF1CC;color:#4A3A00;border-radius:12px;padding:10px 12px;font-size:14px}

.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;color:rgba(255,255,255,.7);font-weight:700}
.seg button.on{background:#fff;color:#1C2038}
.cur{margin-top:10px}
.cur button.on[data-v=“HKD”]{background:#E8344E;color:#fff}
.cur button.on[data-v=“CNY”]{background:#F2B731;color:#1C2038}

.amountRow{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.amountRow span{font-size:26px;font-weight:700;color:#FF7A8C;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif}
body.cny .amountRow span{color:#F2B731}
#amount{width:100%;border:0;border-bottom:2px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-size:52px;font-weight:700;padding:0 0 8px;border-radius:0;outline:none;caret-color:#FF7A8C}
#amount::placeholder{color:rgba(255,255,255,.28)}
#amount:focus{border-bottom-color:#FF7A8C}
body.cny #amount:focus{border-bottom-color:#F2B731}
#rateRow{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:rgba(255,255,255,.75)}
#rateRow input{width:96px;border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:6px 8px;background:rgba(255,255,255,.1);color:#fff;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif}
#conv{width:100%;color:#F2B731;font-weight:700;font-size:18px;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif}

/* body */
.body{padding:20px 16px 0}
.lbl{font-size:14px;color:#667089;margin:0 0 8px;font-weight:600}
.block{margin-top:20px}
#chips,#quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #E1E4EC;background:#FFFFFF;border-radius:999px;padding:9px 15px 9px 12px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#999;flex:none}
.chip.on{background:#1C2038;border-color:#1C2038;color:#fff}
.txt{display:block;width:100%;border:1px solid #E1E4EC;border-radius:12px;padding:12px;background:#FFFFFF;min-height:46px}
#quick{margin-top:10px}
.q{border:1px solid transparent;background:#E9ECF3;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.q.on{background:#1C2038;color:#fff}
.q.add{background:transparent;border:1px dashed #A4ABC0;color:#667089;font-weight:500}
.primary{width:100%;margin-top:24px;border:0;border-radius:16px;background:#E8344E;color:#fff;font-weight:800;font-size:18px;padding:16px;letter-spacing:.06em}
body.cny .primary{background:#F2B731;color:#1C2038}
.ghost{border:1px solid #E1E4EC;background:#FFFFFF;border-radius:12px;padding:10px 14px;font-weight:600}
.danger{border:1px solid #E7B9B9;background:#fff;color:#B91C1C;border-radius:12px;padding:10px 14px;font-weight:600}
#editBar{display:flex;gap:10px;margin-top:12px}
#editBar button{flex:1}
.wide{width:100%;margin-top:12px}

/* report */
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.nav .lab{font-weight:700;font-size:17px;text-align:center;flex:1}
.nav button{border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1}
.today{display:block;margin:4px auto 0;border:0;background:none;color:#F2B731;font-weight:700;padding:6px}
.k2{font-size:14px;color:rgba(255,255,255,.7);margin-top:16px}
.big{font-size:44px;font-weight:800;line-height:1.1;margin-top:2px}
.trio{display:flex;gap:28px;margin-top:12px}
.trio span{display:block;font-size:13px;color:rgba(255,255,255,.7)}
.trio b{font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif;font-variant-numeric:tabular-nums;font-size:18px}
.note{margin-top:12px;font-size:14px;color:#F2B731}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:20px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar{width:100%;border:0;background:#FF7A8C;border-radius:4px 4px 0 0;padding:0;min-height:3px}
.bar.zero{background:rgba(255,255,255,.18)}
.axis{display:flex;gap:3px;margin-top:5px}
.axis span{flex:1;height:14px;position:relative}
.axis i{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}

.panel{background:#FFFFFF;border-radius:20px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
.ribbon{display:flex;gap:3px;height:16px;border-radius:8px;overflow:hidden;margin-bottom:14px}
.ribbon i{display:block;min-width:4px}
.lg{display:flex;align-items:center;gap:10px;padding:7px 0}
.lg .n{flex:1;font-weight:600}
.lg .p{color:#667089;font-size:14px;min-width:38px;text-align:right}
.lg .a{min-width:96px;text-align:right;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
.gh{display:flex;justify-content:space-between;font-size:13px;color:#667089;margin:16px 0 2px;font-weight:600}
.gh:first-of-type{margin-top:0}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid #EEF0F5}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:50%;background:#667089;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rc{flex:1;min-width:0}
.rc b{display:block;font-weight:700}
.rc i{display:block;font-style:normal;font-size:13px;color:#667089;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{text-align:right;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif;font-variant-numeric:tabular-nums}
.ra b{display:block;font-weight:700}
.ra i{display:block;font-style:normal;font-size:12px;color:#8A5A00}
.ra.income b{color:#15803D}
.empty{color:#667089;text-align:center;padding:18px 8px}

/* settings */
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line input,.add input{border:1px solid #E1E4EC;border-radius:10px;padding:9px 10px;background:#fff}
.line input{width:110px;font-family:ui-rounded,“SF Pro Rounded”,“Hiragino Maru Gothic ProN”,system-ui,-apple-system,“PingFang HK”,sans-serif}
.help{font-size:13px;color:#667089;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid #E1E4EC;border-radius:999px;padding:5px 6px 5px 12px;background:#fff;font-size:15px}
.tag button{border:0;background:#E9ECF3;border-radius:50%;width:22px;height:22px;line-height:1;padding:0;color:#667089}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
.pick .chip{padding:7px 12px 7px 10px;font-size:15px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid #E1E4EC;padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{max-width:520px;margin:0 auto;display:flex}
.tabbar button{position:relative;flex:1;border:0;background:transparent;padding:9px 4px 8px;color:#7C849C;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:#E8344E}
.tabbar .dot2{position:absolute;top:7px;left:calc(50% + 9px);width:10px;height:10px;border-radius:50%;background:#E8344E;border:2px solid #fff}
#toast{white-space:pre-line;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1C2038;color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(28,32,56,.3);z-index:60}
#toast.show{opacity:1}

/* 小克 */
.petTop{align-items:center}
.petTop .sub{text-align:left;white-space:pre-line;margin-top:6px;line-height:1.55}
.pet{border:0;background:none;padding:0;width:104px;flex:none;border-radius:14px}
.pet svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%}
.pet svg{animation:bob 1.8s ease-in-out infinite}
.pet.sleep svg{animation:breathe 3.2s ease-in-out infinite}
.pet.full1 svg,.pet.full2 svg,.pet.full3 svg{animation:sway 2.2s ease-in-out infinite}
.pet.jump svg{animation:jump .6s ease-out}
.pet.jiggle svg{animation:jig .6s ease-out}
.fxz{animation:zf 2.4s ease-in-out infinite}
.burp{animation:bp 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.88)}35%{transform:translateY(-24%) scale(.94,1.08)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes jig{0%{transform:scale(1)}20%{transform:scale(1.14,.86)}45%{transform:scale(.92,1.1)}70%{transform:scale(1.05,.96)}100%{transform:scale(1)}}
@keyframes zf{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bp{0%,100%{opacity:0}40%,70%{opacity:.95}}
.bubble{position:relative;background:#fff;color:#1C2038;border-radius:16px;padding:10px 14px 11px;margin:4px 0 16px;font-size:15px;line-height:1.55}
.bubble::before{content:””;position:absolute;top:-8px;right:42px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble .bn{display:block;font-size:12px;color:#B4532F;font-weight:800;margin-bottom:1px}
.bubble.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* Clawd 動畫 */
.pet{width:120px}
.pet svg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.armL,.armR{transform-box:fill-box}
.armL{transform-origin:100% 50%}
.armR{transform-origin:0 50%}
.pet.happy .armL{animation:wl .9s ease-in-out infinite}
.pet.happy .armR{animation:wr .9s ease-in-out infinite}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(28deg)}}
.heart{animation:hf 2.6s ease-in-out infinite}
@keyframes hf{0%{opacity:0;transform:translateY(2px)}30%,60%{opacity:1}100%{opacity:0;transform:translateY(-3px)}}
.sweat{animation:sw 1.4s ease-in infinite}
@keyframes sw{0%{opacity:0;transform:translateY(-1px)}30%{opacity:1}100%{opacity:0;transform:translateY(2px)}}

/* achievements */
.lv{display:flex;align-items:center;gap:10px;margin-top:6px}
.lvb{background:#D97757;color:#1C2038;font-weight:800;border-radius:8px;padding:2px 9px;font-size:14px}
.lvt{font-size:22px;font-weight:800}
.pbar{height:12px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#D97757,#F2B731);border-radius:6px;transition:width .6s}
.pnote{margin-top:8px;font-size:14px;color:rgba(255,255,255,.72)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acard{border:0;background:#fff;border-radius:16px;border-top:4px solid var(–c);padding:14px 6px 10px;min-height:116px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.acard .ai{font-size:32px;line-height:1.15}
.acard b{font-size:13px;font-weight:700;line-height:1.3}
.acard i{font-style:normal;font-size:11px;color:#667089}
.acard.lock{background:#E3E6EE;border-top-color:#C9CEDB}
.acard.lock .ai,.acard.lock b{color:#8E96AD}
.acard.lock .ai{font-weight:800;font-size:30px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(28,32,56,.64);display:grid;place-items:center;padding:20px}
.mcard{position:relative;background:#fff;border-radius:24px;padding:22px 20px 20px;width:100%;max-width:340px;max-height:88dvh;overflow:auto;text-align:center;animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.mtag{font-size:14px;font-weight:700;color:#667089}
.micon{width:96px;height:96px;margin:14px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:color-mix(in srgb,var(–c) 16%,#fff);box-shadow:0 0 0 5px color-mix(in srgb,var(–c) 38%,#fff)}
.mcard.fresh .micon{animation:shine 1.4s ease-out}
@keyframes shine{0%{transform:scale(.4) rotate(-40deg)}60%{transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.mname{font-size:21px;font-weight:800}
.mdesc{font-size:14px;color:#667089;margin-top:2px}
.msay{display:flex;gap:10px;align-items:center;text-align:left;background:#FFF1E8;border-radius:14px;padding:10px 12px;margin-top:16px;font-size:15px}
.mpet{width:56px;flex:none}
.mpet svg{display:block;width:100%;height:auto}
.mrest{margin-top:14px;font-size:13px;color:#667089;text-align:left}
.mrest span{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;background:#F0F2F7;color:#1C2038}
.mok{margin-top:18px;padding:13px}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(–r))}}

@media (prefers-reduced-motion:reduce){
#toast{transition:none}
.pet svg,.fxz,.burp,.mcard,.mcard .micon,.bubble.pop,.pbar i{animation:none!important;transition:none!important}
}
@media (prefers-reduced-motion:reduce){.pet svg .eyes,.armL,.armR,.heart,.sweat{animation:none!important}}
</style>

</head>
<body>
<div id="app">
  <div id="banner" hidden>目前無法儲存資料，關掉頁面後記錄會消失。請把這個檔案放到網址上，用手機瀏覽器開啟。</div>

  <section id="tab-add">
    <div class="hero">
      <div class="heroTop petTop">
        <div><h1 id="title">記帳</h1><div class="sub num" id="sub"></div></div>
        <button class="pet" id="pet" type="button" aria-label="小克"></button>
      </div>
      <div class="bubble" id="bubble" hidden></div>
      <div class="seg" id="typeSeg" role="group" aria-label="類型">
        <button data-v="expense" class="on">支出</button><button data-v="income">收入</button>
      </div>
      <div class="seg cur" id="curSeg" role="group" aria-label="幣別">
        <button data-v="HKD" class="on">港幣 HK$</button><button data-v="CNY">人民幣 ¥</button>
      </div>
      <div class="amountRow"><span id="sym">HK$</span>
        <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autocomplete="off" aria-label="金額"></div>
      <div id="rateRow" hidden>
        <span>匯率 1 人民幣 =</span><input id="rate" type="number" inputmode="decimal" step="0.0001" aria-label="匯率"><span>港幣</span>
        <div id="conv">折合 HK$0.00</div>
      </div>
    </div>
    <div class="body">
      <div class="lbl">分類</div>
      <div id="chips"></div>
      <div class="block">
        <div class="lbl">備註</div>
        <input class="txt" type="text" id="note" placeholder="選填，或點下面的常用備註" autocomplete="off">
        <div id="quick"></div>
      </div>
      <div class="block">
        <div class="lbl">日期</div>
        <input class="txt" type="date" id="date">
      </div>
      <button class="primary" id="save">記一筆</button>
      <button class="ghost wide" id="nospend" type="button">🍃 今天沒有花錢</button>
      <div id="editBar" hidden><button class="danger" id="del">刪除這筆</button><button class="ghost" id="cancel">取消修改</button></div>
    </div>
  </section>

  <section id="tab-report" hidden></section>

  <section id="tab-ach" hidden></section>

  <section id="tab-settings" hidden>
    <div class="hero"><div class="heroTop" style="margin:0"><h1>設定</h1></div></div>
    <div class="body" id="setBody"></div>
  </section>
</div>

<nav class="tabbar" aria-label="主選單"><div>
  <button data-tab="add" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>記帳</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>報表</button>
  <button data-tab="ach"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/></svg>成就<span class="dot2" id="achDot" hidden></span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>設定</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div id="confetti"></div><div class="mcard" id="mcard"></div></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round(n * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hk = n => 'HK$' + fmt(n);
const cn = n => '¥' + fmt(n);
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const store = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    get persistent() { return ok; },
    get(k, d) {
      try { if (ok) { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } } catch (e) {}
      return k in mem ? mem[k] : d;
    },
    set(k, v) {
      mem[k] = v;
      if (ok) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { ok = false; $('banner').hidden = false; } }
    }
  };
})();
if (!store.persistent) $('banner').hidden = false;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function mark(seg, v) {

}
const sumHkd = a => a.reduce((s, e) => s + e.hkd, 0);

/* ---------- entry form ---------- */
const form = { type: 'expense', cur: 'HKD', cat: '', editId: null };

function renderQuick() {

function resetForm() {

function saveEntry() {
  const amt = parseFloat($('amount').value);
  if (!(amt > 0)) { toast('請輸入大於 0 的金額'); return; }
  let rate = 1;
  if (form.cur === 'CNY') { rate = parseFloat($('rate').value); if (!(rate > 0)) { toast('請輸入匯率'); return; } }
  if (!form.cat) { toast('請選擇分類'); return; }
  const old = form.editId ? entries.find(x => x.id === form.editId) : null;
  const e = {
    id: form.editId || uid(), type: form.type, cur: form.cur, amount: round2(amt), rate,
    hkd: round2(amt * rate), cat: form.cat, note: $('note').value.trim(),
    date: $('date').value || ymd(new Date()), ts: old ? old.ts : Date.now()
  };
  const i = entries.findIndex(x => x.id === e.id);
  if (i >= 0) entries[i] = e; else entries.push(e);
  saveEntries();

}
const AUTO_QUICK_AT = 5;
function autoQuick(e) {
  if (!e.note) return false;
  const l = settings.quick[e.cat] = settings.quick[e.cat] || [];
  if (l.includes(e.note) || settings.dismissed.includes(e.cat + '|' + e.note)) return false;
  const n = entries.filter(x => x.cat === e.cat && x.note === e.note).length;
  if (n < AUTO_QUICK_AT) return false;
  l.push(e.note); saveSettings();

}
function startEdit(id) {

/* ---------- reports ---------- */
const rep = { mode: 'day', anchor: new Date() };
function range() {
  const a = new Date(rep.anchor); a.setHours(0, 0, 0, 0);
  if (rep.mode === 'day') return [a, a];
  if (rep.mode === 'week') { const s = startOfWeek(a); return [s, addDays(s, 6)]; }
  return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
function shift(n) {
  const a = new Date(rep.anchor);
  if (rep.mode === 'day') a.setDate(a.getDate() + n);
  else if (rep.mode === 'week') a.setDate(a.getDate() + 7 * n);
  else { a.setDate(1); a.setMonth(a.getMonth() + n); }
  rep.anchor = a;
}
function rangeLabel(f, t) {
  if (rep.mode === 'day') return `${f.getFullYear()}年${f.getMonth() + 1}月${f.getDate()}日 週${WD[f.getDay()]}`;
  if (rep.mode === 'week') return `${f.getMonth() + 1}月${f.getDate()}日 至 ${t.getMonth() + 1}月${t.getDate()}日`;
  return `${f.getFullYear()}年${f.getMonth() + 1}月`;
}
function renderReport() {
  const [f, t] = range(), fs = ymd(f), ts = ymd(t), todayS = ymd(new Date());
  const list = entries.filter(e => e.date >= fs && e.date <= ts);
  const exp = list.filter(e => e.type === 'expense'), inc = list.filter(e => e.type === 'income');
  const E = sumHkd(exp), I = sumHkd(inc), net = I - E;
  const cny = exp.filter(e => e.cur === 'CNY');
  const isCurrent = todayS >= fs && todayS <= ts;
  const unit = { day: '日', week: '週', month: '月' }[rep.mode];

  let h = `<div class="hero"><div class="heroTop"><h1>報表</h1></div>
    <div class="seg" id="modeSeg">${[['day', '日'], ['week', '週'], ['month', '月']].map(([v, n]) => `<button data-mode="${v}" class="${rep.mode === v ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="nav"><button data-nav="-1" aria-label="上一${unit}">‹</button><div class="lab">${rangeLabel(f, t)}</div><button data-nav="1" aria-label="下一${unit}">›</button></div>`;
  if (!isCurrent) h += `<button class="today" data-nav="today">回到本${unit}</button>`;
  h += `<div class="k2">支出（港幣）</div><div class="big">${hk(E)}</div>
    <div class="trio"><div><span>收入</span><b>${hk(I)}</b></div><div><span>結餘</span><b>${net < 0 ? '−' : ''}${hk(Math.abs(net))}</b></div></div>`;
  if (cny.length) h += `<div class="note">含人民幣支出 ${cn(cny.reduce((s, e) => s + e.amount, 0))}，已折合 ${hk(sumHkd(cny))}</div>`;

  if (rep.mode !== 'day') {
    const days = []; for (let d = new Date(f); d <= t; d = addDays(d, 1)) days.push(new Date(d));
    const per = days.map(d => sumHkd(exp.filter(e => e.date === ymd(d))));
    const mx = Math.max(...per, 1);
    h += `<div class="bars">${days.map((d, i) =>
      `<div class="col"><button class="bar${per[i] ? '' : ' zero'}" data-d="${ymd(d)}" style="height:${per[i] ? Math.max(per[i] / mx * 100, 5) : 3}%" aria-label="${d.getMonth() + 1}月${d.getDate()}日 ${hk(per[i])}"></button></div>`).join('')}</div>
      <div class="axis">${days.map((d, i) => {
        const txt = rep.mode === 'week' ? WD[d.getDay()] : ((d.getDate() - 1) % 5 === 0 || i === days.length - 1 ? d.getDate() : '');
        return `<span><i>${txt}</i></span>`;
      }).join('')}</div>`;
  }
  h += '</div><div class="body">';

  const by = {}; exp.forEach(e => by[e.cat] = (by[e.cat] || 0) + e.hkd);
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  h += '<div class="panel"><h2>支出分類</h2>';
  if (cats.length) {
    h += `<div class="ribbon">${cats.map(([c, v]) => `<i style="flex:${v};background:${colorOf(c)}"></i>`).join('')}</div>`;
    h += cats.map(([c, v]) => `<div class="lg"><span class="dot" style="background:${colorOf(c)}"></span><span class="n">${esc(c)}</span><span class="p">${Math.round(v / E * 100)}%</span><span class="a">${hk(v)}</span></div>`).join('');
  } else h += '<div class="empty">這段時間沒有支出</div>';
  h += '</div>';

  h += '<div class="panel"><h2>明細</h2>';
  if (!list.length) h += '<div class="empty">還沒有記錄。到「記帳」記下第一筆。</div>';
  else {
    [...new Set(list.map(e => e.date))].sort().reverse().forEach(ds => {
      const items = list.filter(e => e.date === ds).sort((a, b) => b.id < a.id ? -1 : 1);
      if (rep.mode !== 'day') {
        const d = new Date(ds + 'T00:00:00');
        h += `<div class="gh"><span>${d.getMonth() + 1}月${d.getDate()}日 週${WD[d.getDay()]}</span><span class="num">支出 ${hk(sumHkd(items.filter(e => e.type === 'expense')))}</span></div>`;
      }
      items.forEach(e => {
        const sign = e.type === 'expense' ? '−' : '+';
        h += `<button class="row" data-id="${e.id}"><span class="ic" style="background:${colorOf(e.cat)}">${esc([...e.cat][0])}</span>
          <span class="rc"><b>${esc(e.cat)}</b>${e.note ? `<i>${esc(e.note)}</i>` : ''}</span>
          <span class="ra ${e.type}"><b>${sign}${e.cur === 'CNY' ? cn(e.amount) : hk(e.amount)}</b>${e.cur === 'CNY' ? `<i>${hk(e.hkd)}（匯率 ${e.rate}）</i>` : ''}</span></button>`;
      });
    });
  }
  h += '</div></div>';
  $('tab-report').innerHTML = h;
}

async function fetchRate(manual) {
  try {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch('https://open.er-api.com/v6/latest/CNY', { signal: ctrl.signal }); clearTimeout(tm);
    const j = await r.json(); const v = j && j.rates && j.rates.HKD;
    if (v > 0) {
      settings.rate = Math.round(v * 10000) / 10000; settings.rateUpdated = Date.now(); saveSettings();
      if (form.cur === 'CNY' && !form.editId) { $('rate').value = settings.rate; updateConv(); }
      if (!$('tab-settings').hidden) renderSettings();
      if (manual) toast('匯率已更新：1 人民幣 = ' + settings.rate + ' 港幣');
      return;
    }
  } catch (e) {}
  if (manual) toast('無法取得匯率，請手動輸入');
}

/* ---------- CSV ---------- */
const csvCell = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv() {
  const head = ['date', 'type', 'currency', 'amount', 'rate_to_hkd', 'hkd', 'category', 'note'];
  const rows = entries.map(e => [e.date, e.type, e.cur, e.amount, e.rate, e.hkd, e.cat, e.note])
    .concat(settings.noSpend.map(d => [d, 'nospend', 'HKD', 0, 1, 0, '', '']))
    .sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ledger-' + ymd(new Date()).replace(/-/g, '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setFlag('exported'); checkAch();
}
function parseCsv(text) {
  text = text.replace(/^\ufeff/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}
function importCsv(text) {
  const rows = parseCsv(text); if (rows.length < 2) { toast('檔案沒有資料'); return; }
  const h = rows[0].map(x => x.trim().toLowerCase()); const col = n => h.indexOf(n);
  if (col('date') < 0 || col('amount') < 0) { toast('格式不符，請使用本工具匯出的 CSV'); return; }
  const key = e => [e.date, e.type, e.cur, e.amount, e.cat, e.note].join('|');
  const have = new Set(entries.map(key)); let added = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const g = n => (col(n) >= 0 ? r[col(n)] : '') || '';
    if (g('type') === 'nospend') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(g('date')) && !settings.noSpend.includes(g('date'))) { settings.noSpend.push(g('date')); added++; } else skipped++;
      return;
    }
    const type = g('type') === 'income' ? 'income' : 'expense';
    const cur = g('currency') === 'CNY' ? 'CNY' : 'HKD';
    const amount = round2(parseFloat(g('amount')));
    const rate = cur === 'HKD' ? 1 : parseFloat(g('rate_to_hkd')) || settings.rate;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g('date')) || !(amount > 0)) { skipped++; return; }
    const e = { id: uid(), type, cur, amount, rate, hkd: round2(amount * rate), cat: g('category') || '其他', note: g('note'), date: g('date') };
    if (have.has(key(e))) { skipped++; return; }
    have.add(key(e)); entries.push(e); added++;
    if (!settings.cats[type].includes(e.cat)) settings.cats[type].push(e.cat);
  });
  saveEntries(); saveSettings(); renderChips(); renderSettings(); updateSub();

   小克：寵物、對話、成就
   ===================================================================== */
const petName = () => settings.petName || '小克';
const lastPick = new Map();
const pick = a => { let i; do { i = Math.floor(Math.random() * a.length); } while (a.length > 1 && i === lastPick.get(a)); lastPick.set(a, i); return a[i]; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const nextMonth = k => { const [y, m] = k.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; };
function setFlag(k) { if (!settings.flags[k]) { settings.flags[k] = true; saveSettings(); } }

function streakInfo() {
  const s = new Set(entries.map(e => e.date)); settings.noSpend.forEach(d => s.add(d));
  const arr = [...s].sort();
  let best = 0, run = 0, prev = null;
  arr.forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; if (run > best) best = run; prev = d; });
  let cur = 0, d = new Date();
  if (!s.has(ymd(d))) d = addDays(d, -1);
  while (s.has(ymd(d))) { cur++; d = addDays(d, -1); }
  return { cur, best, last: arr.length ? arr[arr.length - 1] : null };
}

function petState() {
  const si = streakInfo(), now = new Date(), mk = ymd(now).slice(0, 7);
  const spent = sumHkd(entries.filter(e => e.type === 'expense' && e.date.slice(0, 7) === mk));
  const b = settings.budget > 0 ? settings.budget : 0;
  let mood, over = 0, rem = 1;
  if (b) { over = (spent - b) / b; rem = 1 - spent / b; }
  if (b && over > 0) mood = over > .5 ? 'full3' : over > .2 ? 'full2' : 'full1';
  else if (si.last && daysBetween(si.last, ymd(now)) >= 3) mood = 'sleep';
  else if (b) mood = rem >= .6 ? 'happy' : rem >= .3 ? 'calm' : 'nervous';
  else mood = si.cur >= 1 ? 'happy' : 'calm';
  return { mood, b, spent, over, rem, streak: si.cur };
}

/* Clawd 風格像素小生物：橘色方塊身體、兩側小手、四隻短腳、直條眼睛 */
function petSvg(mood) {
  const fat = mood.indexOf('full') === 0 ? +mood[4] : 0;
  const W = 25, H = 13, bw = [11, 13, 15, 17][fat], bh = [5, 6, 7, 8][fat];
  const x0 = (W - bw) / 2, bottom = 10, top = bottom - bh, legs = fat < 2 ? 2 : 1;
  const C = '#D97757', K = '#1C2038', P = '#FF8FA3', B = '#8FD3FF', Wh = '#FFFFFF', HT = '#FF6B81';
  const R = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  let s = '', ev = '', fx = '';
  const add = (x, y, w, h, f) => { s += R(x, y, w, h, f); };
  const eadd = (x, y, w, h, f) => { ev += R(x, y, w, h, f); };
  // 影子
  add(x0 + 1, bottom + legs, bw - 2, 1, 'rgba(0,0,0,.26)');
  // 腳
  const legPos = fat === 3 ? [3, 5, bw - 6, bw - 4] : fat === 2 ? [2, 4, bw - 5, bw - 3] : [1, 3, bw - 4, bw - 2];
  legPos.forEach(o => add(x0 + o, bottom, 1, legs, C));
  // 手
  if (fat < 2) {
    s += `<g class="armL">${R(x0 - 2, top + 2, 2, 2, C)}</g><g class="armR">${R(x0 + bw, top + 2, 2, 2, C)}</g>`;
  } else {
    s += `<g class="armL">${R(x0 - 1, top + 3, 1, 2, C)}</g><g class="armR">${R(x0 + bw, top + 3, 1, 2, C)}</g>`;
  }
  // 身體
  for (let i = 0; i < bh; i++) {
    const ins = fat === 3 ? (i === 0 || i === bh - 1 ? 2 : i === 1 || i === bh - 2 ? 1 : 0) : fat === 2 ? (i === 0 || i === bh - 1 ? 1 : 0) : 0;
    add(x0 + ins, top + i, bw - 2 * ins, 1, C);
  }
  // 臉
  const cx = 12, d = fat >= 2 ? 4 : 3, lx = cx - d, rx = cx + d, ey = top + 1, my = top + 3;
  const eyeV = () => { eadd(lx, ey, 1, 2, K); eadd(rx, ey, 1, 2, K); };
  const eyeLine = () => { add(lx - 1, ey + 1, 3, 1, K); add(rx - 1, ey + 1, 3, 1, K); };
  const arcs = () => [lx, rx].forEach(x => { add(x - 1, ey + 1, 1, 1, K); add(x, ey, 1, 1, K); add(x + 1, ey + 1, 1, 1, K); });
  const smile = () => { add(cx - 1, my, 1, 1, K); add(cx + 1, my, 1, 1, K); add(cx, my + 1, 1, 1, K); };
  const frown = () => { add(cx - 1, my + 1, 1, 1, K); add(cx + 1, my + 1, 1, 1, K); add(cx, my, 1, 1, K); };
  const dot = () => add(cx, my, 1, 1, K);
  const blush = () => { add(lx - 2, ey + 2, 2, 1, P); add(rx + 1, ey + 2, 2, 1, P); };
  if (mood === 'happy') {
    arcs(); smile(); blush();
    const hx = x0 + bw - 3;
    fx += `<g class="heart" fill="${HT}">${R(hx + 1, 0, 1, 1, HT)}${R(hx + 3, 0, 1, 1, HT)}${R(hx, 1, 5, 1, HT)}${R(hx + 1, 2, 3, 1, HT)}${R(hx + 2, 3, 1, 1, HT)}</g>`;
  }
  else if (mood === 'calm') { eyeV(); dot(); }
  else if (mood === 'nervous') { eyeV(); frown(); fx += `<g class="sweat">${R(rx + 2, top - 2, 1, 1, B)}${R(rx + 2, top - 1, 1, 1, B)}</g>`; }
  else if (mood === 'sleep') {
    eyeLine(); dot();
    const a = x0 + bw + 1;
    fx += `<g class="fxz" fill="${Wh}"><rect x="${a}" y="1" width="3" height="1"/><rect x="${a + 1}" y="2" width="1" height="1"/><rect x="${a}" y="3" width="3" height="1"/></g>`;
  }
  else if (mood === 'full1') { eyeV(); blush(); dot(); }
  else if (mood === 'full2') { eyeV(); blush(); smile(); }
  else if (mood === 'full3') {
    eyeLine(); blush(); smile();
    fx += `<g class="burp" fill="${Wh}"><rect x="${x0 + bw + 1}" y="${top + 3}" width="1" height="1"/><rect x="${x0 + bw + 1}" y="${top}" width="2" height="2"/></g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" aria-hidden="true">${s}<g class="eyes">${ev}</g>${fx}</svg>`;
}

const LEVELS = [[0, '見習記帳員'], [5, '記帳新手'], [12, '小有心得'], [22, '記帳達人'], [34, '理財能手'], [46, '錢包守護者'], [58, '小克的好夥伴']];
function levelOf(n) {
  if (n >= ACH.length) return { i: LEVELS.length + 1, t: '傳說管家' };
  let k = 0; LEVELS.forEach((l, i) => { if (n >= l[0]) k = i; });
  return { i: k + 1, t: LEVELS[k][1] };
}

function stats() {
  const exp = entries.filter(e => e.type === 'expense'), inc = entries.filter(e => e.type === 'income');
  const si = streakInfo(), c = { n: entries.length, nInc: inc.length, streak: si.best, f: settings.flags };
  const byDate = {};
  entries.forEach(e => { const o = byDate[e.date] = byDate[e.date] || { n: 0, exp: 0, cur: new Set() }; o.n++; if (e.type === 'expense') o.exp++; o.cur.add(e.cur); });
  const vals = Object.values(byDate);
  c.days = vals.length; c.maxDayN = Math.max(0, ...vals.map(o => o.n)); c.mixDay = vals.some(o => o.cur.size > 1);
  const ns = settings.noSpend.filter(d => !(byDate[d] && byDate[d].exp)).sort();
  c.ns = ns.length; c.nsRun = 0;
  let run = 0, prev = null;
  ns.forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; if (run > c.nsRun) c.nsRun = run; prev = d; });
  c.maxExp = Math.max(0, ...exp.map(e => e.hkd));
  c.tiny = exp.some(e => e.hkd > 0 && e.hkd < 1);
  const cnt = {}; exp.forEach(e => cnt[e.cat] = (cnt[e.cat] || 0) + 1);
  c.catUsed = new Set(Object.keys(cnt)); c.catMax = Math.max(0, ...Object.values(cnt));
  c.catAll = settings.cats.expense.length >= 5 && settings.cats.expense.every(k => c.catUsed.has(k));
  c.custom = entries.some(e => !BASE_CATS.includes(e.cat));
  const cny = entries.filter(e => e.cur === 'CNY');
  c.nCny = cny.length; c.cnyTotal = cny.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  c.notes = entries.filter(e => e.note).length;
  const withTs = entries.filter(e => e.ts);
  c.hours = withTs.map(e => new Date(e.ts).getHours());
  c.late = withTs.some(e => daysBetween(e.date, ymd(new Date(e.ts))) >= 2);
  c.wk = new Set(entries.map(e => new Date(e.date + 'T00:00:00').getDay()));
  c.md = new Set(entries.map(e => e.date.slice(5)));
  c.eom = entries.some(e => addDays(new Date(e.date + 'T00:00:00'), 1).getDate() === 1);
  c.lucky = entries.some(e => [888, 666, 520, 1314, 168, 88].includes(e.amount));
  c.quickN = Object.values(settings.quick).reduce((s, a) => s + a.length, 0);
  c.renamed = petName() !== '小克';
  const M = {};
  entries.forEach(e => { const k = e.date.slice(0, 7); const o = M[k] = M[k] || { exp: 0, inc: 0, d: new Set() }; if (e.type === 'expense') o.exp += e.hkd; else o.inc += e.hkd; o.d.add(e.date); });
  const nowK = ymd(new Date()).slice(0, 7), cur = M[nowK];
  c.budget = settings.budget > 0 ? settings.budget : 0;
  c.posMonth = Object.values(M).some(o => o.exp > 0 && o.inc > o.exp);
  const past = Object.keys(M).filter(k => k < nowK);
  const ok = c.budget ? past.filter(k => M[k].d.size >= 5 && M[k].exp <= c.budget) : [];
  c.pastOk = ok; c.pastOk2 = ok.some(k => ok.includes(nextMonth(k)));
  c.pastSave = !!c.budget && past.some(k => M[k].d.size >= 5 && M[k].exp <= c.budget * .8);
  c.overPct = c.budget && cur ? (cur.exp - c.budget) / c.budget : 0;
  c.half = !!c.budget && !!cur && new Date().getDate() >= 15 && cur.exp <= c.budget * .5;
  return c;
}

let unlockQ = [], modalOpen = false;
function checkAch() {
  const c = stats(), fresh = [];
  ACH.forEach(a => {
    if (settings.ach[a.id]) return;
    let ok = false; try { ok = !!a.t(c); } catch (e) {}
    if (ok) { settings.ach[a.id] = Date.now(); fresh.push(a); }
  });
  if (fresh.length) { saveSettings(); unlockQ.push(...fresh); if (!modalOpen) flushUnlock(); }
  if (!$('tab-ach').hidden) renderAch();
  updateBadge();
}
function updateBadge() { $('achDot').hidden = Object.keys(settings.ach).length <= (settings.achSeen || 0) || !$('tab-ach').hidden; }
function dateLabel(ts) { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }
function flushUnlock() {
  if (!unlockQ.length) return;
  const q = unlockQ.splice(0); openModal(q[0], q.slice(1), true);
}
function openModal(a, rest, fresh) {
  modalOpen = true;
  const mc = $('mcard'); mc.classList.toggle('fresh', fresh);
  mc.innerHTML = `<div class="mtag">${fresh ? '🎉 成就解鎖！' : '已解鎖 · ' + dateLabel(settings.ach[a.id])}</div>
    <div class="micon" style="--c:${AC[a.cat]}">${a.icon}</div>
    <div class="mname">${esc(a.name)}</div><div class="mdesc">${esc(a.desc)}</div>
    <div class="msay"><span class="mpet">${petSvg('happy')}</span><span>${esc(a.line.replace(/\{name\}/g, petName()))}</span></div>
    ${rest.length ? `<div class="mrest">同時還解鎖了 ${rest.length} 個：${rest.slice(0, 12).map(r => `<span>${r.icon} ${esc(r.name)}</span>`).join('')}${rest.length > 12 ? '<span>…</span>' : ''}</div>` : ''}
    <button class="primary mok" id="mok" type="button">${fresh ? '收下了' : '關閉'}</button>`;
  $('modal').hidden = false; $('mok').focus();
  if (fresh) { confetti(); say(a.line, 9000); animate('jump'); }
}
function closeModal() {
  $('modal').hidden = true; modalOpen = false; $('confetti').innerHTML = '';
  if (unlockQ.length) flushUnlock();
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#D97757', '#F2B731', '#E8344E', '#2563EB', '#15803D', '#BE185D', '#FFFFFF'];
  $('confetti').innerHTML = Array.from({ length: 40 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${pick(cols)};animation-delay:${(Math.random() * .6).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.4).toFixed(2)}s;--r:${Math.floor(Math.random() * 720 - 360)}deg"></i>`).join('');
}
function renderAch() {
  const done = ACH.filter(a => settings.ach[a.id]).sort((a, b) => settings.ach[b.id] - settings.ach[a.id]);
  const todo = ACH.length - done.length, n = done.length, T = ACH.length, lv = levelOf(n), pct = Math.round(n / T * 100);
  const cardDone = a => `<button class="acard" data-a="${a.id}" style="--c:${AC[a.cat]}"><span class="ai">${a.icon}</span><b>${esc(a.name)}</b><i>${dateLabel(settings.ach[a.id])}</i></button>`;
  const cardLock = '<button class="acard lock" aria-label="尚未解鎖"><span class="ai">？</span><b>？？？</b><i>&nbsp;</i></button>';
  $('tab-ach').innerHTML = `<div class="hero"><div class="heroTop"><h1>成就</h1><div class="sub num">${n} / ${T}</div></div>
    <div class="lv"><span class="lvb">Lv.${lv.i}</span><span class="lvt">${esc(lv.t)}</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pnote">${todo ? `還有 ${todo} 個祕密等著你發現` : '全部都解鎖了，太厲害了！'}</div></div>
    <div class="body"><div class="agrid">${done.map(cardDone).join('')}${cardLock.repeat(todo)}</div></div>`;
  if (settings.achSeen !== n) { settings.achSeen = n; saveSettings(); }
  updateBadge();
}

/* ---------- navigation & events ---------- */
function showTab(name) {
  ['add', 'report', 'ach', 'settings'].forEach(n => $('tab-' + n).hidden = n !== name);
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'report') { renderReport(); if (!settings.flags.report) { setFlag('report'); checkAch(); } }
  if (name === 'ach') renderAch();
  if (name === 'settings') renderSettings();
  updateSub(); updateBadge();
  window.scrollTo(0, 0);
}
document.querySelector('.tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
$('typeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); });
$('curSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCur(b.dataset.v); });
$('amount').addEventListener('input', updateConv);
$('rate').addEventListener('input', updateConv);
$('note').addEventListener('input', renderQuick);
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { form.cat = b.dataset.c; renderChips(); } });
$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.qadd) {
    const note = $('note').value.trim();
    if (!form.cat || !note) return;
    (settings.quick[form.cat] = settings.quick[form.cat] || []).push(note);
    settings.dismissed = settings.dismissed.filter(k => k !== form.cat + '|' + note); saveSettings();
    toast('已加入「' + form.cat + '」常用備註');
    checkAch();
  } else if (b.dataset.q) {
    $('note').value = $('note').value.trim() === b.dataset.q ? '' : b.dataset.q;
  }
  renderQuick();
});
$('save').addEventListener('click', saveEntry);
$('del').addEventListener('click', deleteEntry);
$('cancel').addEventListener('click', resetForm);
$('nospend').addEventListener('click', toggleNoSpend);
$('pet').addEventListener('click', () => {
  const f = settings.flags; f.taps = (f.taps || 0) + 1; saveSettings();
  const st = petState(), fat = st.mood.indexOf('full') === 0;
  if (f.taps === 10) say('你很愛戳我欸……嗯，我不討厭。');
  else if (f.taps === 100) say('戳了一百下……我們現在算很熟了吧。');
  else say(tapLine(st));
  animate(fat ? 'jiggle' : 'jump');
  if (f.taps === 10 || f.taps === 100) checkAch();
});
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.id === 'mok') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) closeModal(); });

$('tab-report').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { rep.mode = b.dataset.mode; renderReport(); }
  else if (b.dataset.nav) { if (b.dataset.nav === 'today') rep.anchor = new Date(); else shift(+b.dataset.nav); renderReport(); }
  else if (b.dataset.d) { rep.mode = 'day'; rep.anchor = new Date(b.dataset.d + 'T00:00:00'); renderReport(); window.scrollTo(0, 0); }
  else if (b.dataset.id) startEdit(b.dataset.id);
});
$('tab-ach').addEventListener('click', e => {
  const b = e.target.closest('.acard'); if (!b) return;
  const a = ACH.find(x => x.id === b.dataset.a);
  if (a && settings.ach[a.id]) openModal(a, [], false); else toast(pick(L.lockedTap));
});
$('tab-settings').addEventListener('change', e => {
  if (e.target.id === 'setBudget') {
    const v = parseFloat(e.target.value); settings.budget = v > 0 ? v : 0; saveSettings(); updateSub();
    toast(settings.budget ? '每月預算已儲存' : '已取消預算'); checkAch();
  } else if (e.target.id === 'setPet') {
    settings.petName = e.target.value.trim() || '小克'; e.target.value = settings.petName; saveSettings(); updateSub();
    toast('已改名為「' + settings.petName + '」'); renderSettings(); checkAch();
  } else if (e.target.id === 'setRate') {
    const v = parseFloat(e.target.value);
    if (v > 0) { settings.rate = v; saveSettings(); toast('匯率已儲存'); } else e.target.value = settings.rate;
  }
});
$('tab-settings').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, t = b.dataset.t;
  if (act === 'fetchRate') fetchRate(true);
  else if (act === 'export') { if (!entries.length && !settings.noSpend.length) toast('還沒有帳目可匯出'); else exportCsv(); }
  else if (act === 'import') $('file').click();
  else if (act === 'qsel') { qSel = b.dataset.c; renderSettings(); }
  else if (act === 'qadd') {
    const v = $('newq').value.trim(); if (!v) return;
    const l = settings.quick[qSel] = settings.quick[qSel] || [];
    if (l.includes(v)) { toast('已經有這個備註'); return; }
    l.push(v); settings.dismissed = settings.dismissed.filter(k => k !== qSel + '|' + v); saveSettings(); renderSettings(); renderQuick(); checkAch();
  } else if (act === 'qdel') {
    settings.quick[qSel] = (settings.quick[qSel] || []).filter(q => q !== b.dataset.q);
    settings.dismissed.push(qSel + '|' + b.dataset.q); saveSettings(); renderSettings(); renderQuick();
  } else if (act === 'addcat') {
    const v = $('newcat-' + t).value.trim(); if (!v) return;
    if (settings.cats[t].includes(v)) { toast('分類已存在'); return; }
    settings.cats[t].push(v); saveSettings(); renderSettings(); renderChips();
  } else if (act === 'delcat') {
    if (settings.cats[t].length <= 1) { toast('至少要保留一個分類'); return; }
    settings.cats[t] = settings.cats[t].filter(c => c !== b.dataset.c); saveSettings(); renderSettings(); renderChips();
  } else if (act === 'clear') {
    if (confirm(`確定清除全部 ${entries.length} 筆帳目？此操作無法還原，建議先匯出 CSV。`)) {
      entries = []; settings.noSpend = []; saveEntries(); saveSettings(); renderSettings(); updateSub(); toast('已清除');
    }
  }
});
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importCsv(String(r.result)); r.readAsText(f); e.target.value = '';
});

/* ---------- init ---------- */
$('date').value = ymd(new Date());
setType('expense'); setCur('HKD'); updateSub();
{
  const st = petState();
  if (st.mood === 'sleep') setFlag('woke');
  setTimeout(() => { say(moodLine(st), 6500); animate('jump'); checkAch(); }, 500);
}
updateBadge();
if (!settings.rateUpdated || Date.now() - settings.rateUpdated > 6 * 3600 * 1000) fetchRate(false);
})();
</script>

</body>
</html>
